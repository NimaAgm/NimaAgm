function esc(s){
  return String(s).replace(/[&<>"]/g, c => (

}

/* Build an anchor tag for the terminal */
function link(href, label){
  return '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +

}

function scrollDown(){
  screenEl.scrollTop = screenEl.scrollHeight;

let demoRunning       = false;
let continueResolver  = null;

function waitForContinue(seconds){
  return new Promise(resolve => {
    let remaining = seconds;
    const line = printRaw('');

    const render = () => {
      line.innerHTML =
        '<span class="d">   Press </span><span class="k">Enter</span>' +
        '<span class="d"> to continue · auto-continue in </span>' +
        '<span class="warn">' + remaining + 's</span>' +
        '<span class="d"> ...</span>';
    };
    render();

    let settled = false;
    const finish = reason => {
      if (settled) return;
      settled = true;
      clearInterval(iv);
      continueResolver = null;
      const label = (reason === 'enter') ? 'continued' : 'auto-continued';
      line.innerHTML =
        '<span class="d">   ── </span><span class="ok">' + label + '</span>' +
        '<span class="d"> ──</span>';
      resolve(reason);
    };

    const iv = setInterval(() => {
      remaining--;
      if (remaining <= 0) finish('timeout');
      else render();
    }, 1000);

    continueResolver = () => finish('enter');
  });
}

/* ---------------- ls / cat ---------------- */
const FILES = {
  'about.txt':      () => cmdAbout(),
  'experience.txt': () => cmdExperience([]),
  'skills.txt':     () => cmdSkills(),
  'education.txt':  () => cmdEducation(),
  'research.txt':   () => cmdResearch(),
  'contact.txt':    () => cmdContact(),
  'neofetch.exe':   () => cmdNeofetch(),
  'demo.sh':        () => cmdDemo()
};

function cmdLs(){
  const names = Object.keys(FILES);
  printRaw(names.map(n => {
    const cls = (n.endsWith('.exe') || n.endsWith('.sh')) ? 'warn' : 'k';
    return '<span class="' + cls + '">' + esc(n) + '</span>';
  }).join('   '));
}

function cmdCat(args){
  if (!args || !args.length){
    printRaw('<span class="err">cat: missing operand</span>');
    printRaw('<span class="d">try: ls</span>');
    return;
  }
  let name = args[0];
  if (!FILES[name] && FILES[name + '.txt']) name = name + '.txt';

  if (!FILES[name]){
    printRaw('<span class="err">cat: ' + esc(args[0]) + ': No such file or directory</span>');
    return;
  }
  FILES[name]();
}

/* ---------------- misc ---------------- */
function cmdOpen(args){
  if (!args || !args.length){
    printRaw('<span class="err">open: missing target</span>');
    printRaw('<span class="d">usage: open github | linkedin | email</span>');
    return;
  }
  const t = args[0].toLowerCase();
  const map = {
    github:   CONTACT.github,
    linkedin: CONTACT.linkedin,
    email:    'mailto:' + CONTACT.email,
    mail:     'mailto:' + CONTACT.email
  };
  if (!map[t]){
    printRaw('<span class="err">open: unknown target "' + esc(t) + '"</span>');
    return;
  }
  printRaw('<span class="d">opening </span>' + link(map[t], map[t]) + '<span class="d"> ...</span>');
  window.open(map[t], '_blank', 'noopener');
}

function cmdHistory(){
  if (!history.length){
    printRaw('<span class="d">(no commands yet)</span>');
    return;
  }
  history.forEach((h, i) => {
    printRaw('<span class="d">' + String(i + 1).padStart(4, ' ') + '  </span>' + esc(h));

}

function cmdSudo(args){
  const sub = (args[0] || '').toLowerCase();
  if (sub === 'hire' || sub === 'hire-me' || sub === 'recruit'){
    printRaw('<span class="ok">[sudo] password for recruiter: ********</span>');

    printRaw('<span class="d">→ </span>' + link('mailto:' + CONTACT.email, 'send email'));

  exp: 'experience', work: 'experience',

  tech: 'skills', stack: 'skills',

};

const commands = {
  demo:       { run: () => cmdDemo() },
  help:       { run: () => cmdHelp() },
  about:      { run: () => cmdAbout() },
  experience: { run: a  => cmdExperience(a) },

/* =========================================================
   INPUT HANDLING
   ========================================================= */
const history = [];
let histIdx = 0;
let draft = '';

function updateMirror(){
  mirrorEl.innerHTML = esc(inputEl.value) + '<span class="cursor"></span>';
}

function runCommand(raw){
  const trimmed = raw.trim();

  printRaw(PROMPT_HTML + '<span class="cmd">' + esc(trimmed) + '</span>');

  if (!trimmed) return;

  history.push(trimmed);
  histIdx = history.length;
  draft = '';

  const parts = trimmed.split(/\s+/);
  let name = parts[0].toLowerCase();
  const args = parts.slice(1);

  if (ALIASES[name]) name = ALIASES[name];

  const cmd = commands[name];
  if (!cmd){
    printRaw('<span class="err">command not found: ' + esc(parts[0]) + '</span>');
    printRaw('<span class="d">type </span><span class="k">help</span><span class="d"> to see available commands</span>');
    return;
  }
  cmd.run(args);
}

function submit(){
  const val = inputEl.value;
  inputEl.value = '';
  updateMirror();
  runCommand(val);
  scrollDown();
}

function complete(){
  const val = inputEl.value;
  const parts = val.split(/\s+/);

  if (parts.length <= 1){
    const stub = parts[0].toLowerCase();
    const matches = Object.keys(commands).filter(c => c.startsWith(stub));
    if (matches.length === 1){
      inputEl.value = matches[0] + ' ';
    } else if (matches.length > 1){
      printRaw(PROMPT_HTML + esc(val));
      printRaw(matches.map(m => '<span class="k">' + m + '</span>').join('   '));
    }
  } else if (parts[0] === 'cat'){
    const stub = (parts[1] || '').toLowerCase();
    const matches = Object.keys(FILES).filter(f => f.startsWith(stub));
    if (matches.length === 1){
      inputEl.value = 'cat ' + matches[0];
    } else if (matches.length > 1){
      printRaw(PROMPT_HTML + esc(val));
      printRaw(matches.map(m => '<span class="k">' + m + '</span>').join('   '));
    }
  } else if (parts[0] === 'experience'){
    inputEl.value = 'experience ' + (parts[1] || '1');
  } else if (parts[0] === 'open'){
    inputEl.value = 'open ' + (parts[1] || 'email');
  }
  updateMirror();
}

inputEl.addEventListener('keydown', e => {

  if (e.key === 'Enter'){
    e.preventDefault();

    if (continueResolver){
      continueResolver();
      inputEl.value = '';
      updateMirror();
      return;
    }

    if (demoRunning){
      inputEl.value = '';
      updateMirror();
      return;
    }

    submit();
    return;
  }

  if (e.key === 'ArrowUp'){
    e.preventDefault();
    if (!history.length) return;
    if (histIdx === history.length) draft = inputEl.value;
    if (histIdx > 0){
      histIdx--;
      inputEl.value = history[histIdx];
      updateMirror();
    }
    return;
  }

  if (e.key === 'ArrowDown'){
    e.preventDefault();
    if (histIdx < history.length){
      histIdx++;
      inputEl.value = (histIdx === history.length) ? draft : history[histIdx];
      updateMirror();
    }
    return;
  }

  if (e.key === 'Tab'){
    e.preventDefault();
    complete();
    return;
  }

  if (e.key === 'l' && e.ctrlKey){
    e.preventDefault();
    outputEl.innerHTML = '';
    return;
  }

  if (e.key === 'c' && e.ctrlKey){
    e.preventDefault();

    if (continueResolver){
      continueResolver();
      inputEl.value = '';
      updateMirror();
      return;
    }

    printRaw(PROMPT_HTML + '<span class="cmd">' + esc(inputEl.value) + '</span><span class="d">^C</span>');
    inputEl.value = '';
    updateMirror();
    return;
  }

  if (e.key === 'u' && e.ctrlKey){
    e.preventDefault();
    inputEl.value = '';
    updateMirror();
  }
});

inputEl.addEventListener('input', updateMirror);

/* Click-to-focus the prompt — but DO NOT steal focus from links.
   If the user clicked a link, let the browser handle it. */
document.addEventListener('mousedown', e => {
  if (e.target.closest('a')) return;
  setTimeout(() => {
    if (!window.getSelection().toString()) inputEl.focus();
  }, 0);
});

/* Links should open normally — don't let the terminal intercept them. */
document.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  /* Let the default navigation happen; stop the terminal input focus shift. */
  e.stopPropagation();
});
